# Local Postgres + pgvector for the Cortex index.
# Port 5433 (not 5432) so this can never collide with a project's own Postgres.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cortex-postgres
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5433:5432"
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cortex_pgdata:
