# Ingestion sources for the Cortex index.
#
# Each entry becomes one walked directory. `project` and `source_type` are
# written onto every chunk, which is what lets search be scoped (and what lets
# an unscoped query self-route: PMS chunks simply outscore the rest).
#
# Paths resolve ${CORTEX_ROOT} at load time; directory names match the GitHub
# repository names. Point SOURCES_CONFIG at a copy for a different layout.
#
# `include`/`exclude` use globset syntax, matched against the path relative to
# `path`. Exclusions always win over inclusions, and the global secret denylist
# in src/sources.py is appended to every source's excludes — no include pattern
# here can pull a secret in. Code sources also inherit DERIVED_DENYLIST, so
# `exclude` here carries only what is specific to that repository.

- name: cortex-vault
  path: ${CORTEX_ROOT}/cortex
  # Fallback for cross-cutting PARA folders (00-inbox, 02-areas, 03-resources):
  # material that belongs to no single project.
  project: shared
  source_type: note
  include:
    - "**/*.md"
  exclude:
    - "00-templates/**"
    - "**/.obsidian/**"
  # Derived per file from the PARA path. Folder names differ from the project
  # slugs used by the code sources, so the mapping is explicit rather than
  # inferred — brightmes-pms notes and the brightmesh-pms-mono repo must land on
  # the same `pms` tag for a scoped search to span both.
  project_map:
    01-projects/brightmes-pms: pms
    04-archive/brightmes-pms: pms
    01-projects/capsul: capsul
    01-projects/pantrypal: pantrypal
    01-projects/yule-financials: yule
    01-projects/cortex-rag: cortex-rag
    01-projects/homelab: homelab
    01-projects/iec-tender: iec-tender
  # Superseded planning notes. Still indexed — the history has value — but
  # demoted at query time, because an archived PayFast plan was outranking the
  # current billing reference.
  archived_prefixes:
    - "04-archive/"

# The PMS monorepo — the code the vault's architecture and billing notes
# describe (apps/api/src/billing/, apps/api/src/common/payfast/, …).
- name: brightmesh-pms
  path: ${CORTEX_ROOT}/brightmesh-pms-mono
  project: pms
  source_type: code
  repo: brightmesh-pms-mono
  include:
    - "apps/**/*.ts"
    - "apps/**/*.tsx"
    - "packages/**/*.ts"
    - "packages/**/*.tsx"
    - "**/*.prisma"
    - "**/*.md"
    - "infra/**/*.tf"

# Superseded by brightmesh-pms-mono, same `pms` tag so a scoped search spans both.
- name: lema-api
  path: ${CORTEX_ROOT}/lema-api
  project: pms
  source_type: code
  repo: lema-api
  archived: true
  include:
    - "src/**/*.ts"
    - "**/*.prisma"
    - "**/*.md"

- name: capsul
  path: ${CORTEX_ROOT}/capsul.africa-mono
  project: capsul
  source_type: code
  repo: capsul.africa-mono
  include:
    - "apps/**/*.ts"
    - "apps/**/*.tsx"
    - "packages/**/*.ts"
    - "packages/**/*.tsx"
    - "**/*.prisma"
    - "**/*.md"
  exclude:
    - ".claude/**"

- name: yule-api
  path: ${CORTEX_ROOT}/yule-api
  project: yule
  source_type: code
  repo: yule-api
  include:
    - "src/**/*.ts"
    - "test/**/*.ts"
    - "**/*.prisma"
    - "**/*.md"

# Same project tag as yule-api, so one scoped search spans client and backend.
- name: yule-app
  path: ${CORTEX_ROOT}/yule-financial-rn-app
  project: yule
  source_type: code
  repo: yule-financial-rn-app
  include:
    - "src/**/*.ts"
    - "src/**/*.tsx"
    - "docs/**/*.md"
    - "db-schemas/**/*.prisma"
    - "*.md"
  exclude:
    - "ios/**"
    - "android/**"
    - "**/.expo/**"

- name: pantrypal
  path: ${CORTEX_ROOT}/pantrypal-mono
  project: pantrypal
  source_type: code
  repo: pantrypal-mono
  include:
    - "apps/**/*.ts"
    - "apps/**/*.tsx"
    - "packages/**/*.ts"
    - "packages/**/*.tsx"
    - "**/*.prisma"
    - "**/*.md"

- name: pantrypal-simulator
  path: ${CORTEX_ROOT}/pantrypal-simulator
  project: pantrypal
  source_type: code
  repo: pantrypal-simulator
  archived: true
  include:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.md"

- name: skills-qa
  path: ${CORTEX_ROOT}/skills-qa
  project: skills-qa
  source_type: code
  repo: skills-qa
  include:
    - "**/*.ts"
    - "**/*.py"
    - "**/*.md"

- name: cortex-rag
  path: ${CORTEX_ROOT}/cortex-rag
  project: cortex-rag
  source_type: code
  repo: cortex-rag
  include:
    - "src/**/*.py"
    - "**/*.md"
    - "**/*.yaml"
